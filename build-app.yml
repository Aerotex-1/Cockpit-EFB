# Baut den Windows-Installer, sobald ein Tag "app-v…" gepusht wird (z. B. app-v1.0.1),
# und hängt ihn an ein Release mit diesem Tag an.
name: Build App
on:
  push:
    tags: ['app-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version aus dem Tag übernehmen
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#app-v}"
          cd app && npm version "$V" --no-git-tag-version --allow-same-version
          node -e "const f='code/package.json',j=require('./'+f);j.version='$V';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Abhängigkeiten installieren
        run: cd app && npm install
      - name: Installer bauen
        run: cd app && npm run dist
      - name: App-Code-ZIP erzeugen (für Updates ohne Installer)
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#app-v}"
          cd app && tar -a -c -f "dist/Cockpit-EFB-App-Code-$V.zip" code
      - name: Installer mit festem Namen kopieren (für den Direkt-Download-Link in der README)
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#app-v}"
          cp "app/dist/Cockpit-EFB-Setup-$V.exe" "app/dist/Cockpit-EFB-Setup.exe"
      - name: An Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            app/dist/Cockpit-EFB-Setup-*.exe
            app/dist/Cockpit-EFB-Setup.exe
            app/dist/Cockpit-EFB-App-Code-*.zip
