<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cockpit EFB koppeln</title>
<script src="i18n-en.js"></script><script src="i18n.js"></script>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1117;color:#e8eef3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px;box-sizing:border-box}
main{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px} p{margin:0;color:#8fa3b3;line-height:1.5;font-size:15px}
input[hidden]{display:none}
input::placeholder{letter-spacing:1px;font-size:16px;font-weight:400}
input{font:600 28px ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px;text-align:center;background:#16212b;color:#fff;border:1px solid #2b3b49;border-radius:12px;padding:14px}
button{font:700 17px inherit;background:#17475c;color:#7fdcff;border:1px solid #38c8f5;border-radius:12px;padding:14px}
#err{color:#ffb020;min-height:20px;font-size:14px}
</style></head><body><main>
<h1 id="ttl">Cockpit EFB koppeln</h1>
<p id="txt">Gib die PIN ein, die du beim ersten Start festgelegt hast. Vergessen? Sie steht am PC im EFB unter Setup → Zugang.</p>
<input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code" autofocus placeholder="······">
<input id="pin2" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="······" hidden>
<button id="go">Koppeln</button><div id="err"></div>
</main>
<script>
const pin=document.getElementById('pin'),pin2=document.getElementById('pin2'),err=document.getElementById('err'),go_=document.getElementById('go');
let first=false;
fetch('/api/pair/state').then(r=>r.json()).then(s=>{
  if(!s.needsPin)return;
  first=true;
  document.getElementById('ttl').textContent='PIN festlegen';
  document.getElementById('txt').textContent='Lege eine PIN mit 4 bis 8 Ziffern fest. Mit ihr koppelst du weitere Geräte. Vergisst du sie, findest du sie am PC im EFB unter Setup → Zugang.';
  pin.placeholder='PIN'; pin.setAttribute('autocomplete','new-password'); pin2.hidden=false; pin2.placeholder='PIN wiederholen';
  go_.textContent='PIN festlegen';
}).catch(()=>{});
async function go(){
  err.textContent='';
  if(first&&pin.value!==pin2.value){err.textContent='Die PINs sind verschieden.';return}
  try{
    const r=await fetch(first?'/api/pair/set':'/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value})});
    const d=await r.json();
    if(r.ok&&d.ok){location.replace('/');return}
    err.textContent=d.error||'Das hat nicht geklappt.';
  }catch(e){err.textContent='PC-Brücke nicht erreichbar.'}
}
go_.onclick=go;
pin.addEventListener('keydown',e=>{if(e.key==='Enter'&&!first)go()});
pin2.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
pin.addEventListener('input',()=>{if(!first&&pin.value.length===8)go()});
</script></body></html>
